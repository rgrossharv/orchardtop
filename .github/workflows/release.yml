name: Release OrchardTop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Apple Silicon release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Test power decoding
        run: ./scripts/test-power.sh

      - name: Install release build tools
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew update --quiet
          brew install --force --overwrite gcc@15 lowdown

      - name: Build OrchardTop
        run: make QUIET=true CXX="$(brew --prefix gcc@15)/bin/g++-15"

      - name: Test terminal startup and theme
        run: python3 tests/theme_smoke.py

      - name: Package OrchardTop
        run: |
          stage="$(mktemp -d)"
          make QUIET=true CXX="$(brew --prefix gcc@15)/bin/g++-15" DESTDIR="$stage" PREFIX=/usr/local install
          test -f "$stage/usr/local/share/orchardtop/themes/apple-dark.theme"
          "$stage/usr/local/bin/otop" --version
          tar -C "$stage/usr/local" -czf orchardtop-macos-arm64.tar.gz .
          shasum -a 256 orchardtop-macos-arm64.tar.gz > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            orchardtop-macos-arm64.tar.gz \
            checksums.txt \
            --verify-tag \
            --notes-file RELEASE_NOTES.md
